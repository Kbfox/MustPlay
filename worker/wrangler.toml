name = "mustplay-igdb"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[ai]
binding = "AI"   # Workers AI for the Scout agent: no API key, billed to the Cloudflare account (free tier first)

[vars]
LLM_PROVIDER = "openai-compatible"   # workers-ai | openai-compatible (needs LLM_BASE_URL + secret LLM_API_KEY)
LLM_MODEL = "deepseek-chat"          # Workers AI fallback: @cf/meta/llama-3.3-70b-instruct-fp8-fast
LLM_BASE_URL = "https://api.deepseek.com"
QLOO_BASE_URL = "https://hackathon.api.qloo.com"

# Secrets are NOT stored here. Set them with:
#   npx wrangler secret put TWITCH_CLIENT_ID
#   npx wrangler secret put TWITCH_CLIENT_SECRET
#   npx wrangler secret put QLOO_API_KEY     (without it the Scout agent runs on fixture data)
#   npx wrangler secret put APP_KEY          (optional; must match IGDB_APP_KEY in the app)
#   npx wrangler secret put LLM_API_KEY      (only for LLM_PROVIDER=openai-compatible)
