name: MustPlay
options:
  bundleIdPrefix: com.mustplay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: "5.0.0"
  OneSignal:
    url: https://github.com/OneSignal/OneSignal-XCFramework.git
    from: "5.0.0"

targets:
  MustPlay:
    type: application
    platform: iOS
    sources:
      - path: MustPlay
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
      - package: OneSignal
        product: OneSignalFramework
      - target: OneSignalNotificationServiceExtension
    entitlements:
      path: MustPlay/MustPlay.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.mustplay.ios.onesignal
    info:
      path: MustPlay/Info.plist
      properties:
        CFBundleDisplayName: MustPlay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Injected from Config/Secrets.xcconfig at build time
        RC_API_KEY: $(RC_API_KEY)
        ONESIGNAL_APP_ID: $(ONESIGNAL_APP_ID)
        IGDB_PROXY_URL: $(IGDB_PROXY_URL)
        IGDB_APP_KEY: $(IGDB_APP_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mustplay.ios
        PRODUCT_NAME: MustPlay
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  OneSignalNotificationServiceExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: OneSignalNotificationServiceExtension
    dependencies:
      - package: OneSignal
        product: OneSignalExtension
    entitlements:
      path: OneSignalNotificationServiceExtension/OneSignalNotificationServiceExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mustplay.ios.onesignal
    info:
      path: OneSignalNotificationServiceExtension/Info.plist
      properties:
        CFBundleDisplayName: OneSignalNotificationServiceExtension
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mustplay.ios.OneSignalNotificationServiceExtension
